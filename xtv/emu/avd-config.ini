# avd-config.ini — claves que bootstrap.sh sobrescribe en el config.ini del
# AVD tras crearlo. Perfil vertical de baja resolución: suficiente para verse
# bien vía scrcpy en un monitor sin inflar el costo de encode.
hw.ramSize=2048
disk.dataPartition.size=4G
hw.lcd.width=720
hw.lcd.height=1600
hw.lcd.density=320
hw.keyboard=yes
hw.audioOutput=yes
fastboot.forceColdBoot=no
